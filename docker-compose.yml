services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: guardapi
      POSTGRES_PASSWORD: guardapi
      POSTGRES_DB: guardapi
    ports:
      - '5432:5432'
    volumes:
      - guardapi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guardapi']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://guardapi:guardapi@postgres:5432/guardapi?schema=public
      JWT_SECRET: local-dev-secret-do-not-use-in-production
      PORT: 4000
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  guardapi_postgres_data:
  backend_node_modules:
  frontend_node_modules:
